backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.34;
shadow-offset-x = -10;
shadow-offset-y = -10;
fading = true;
fade-in-step = 0.035;
fade-out-step = 0.035;
inactive-opacity = 0.96;
active-opacity = 0.98;
frame-opacity = 0.96;
blur-method = "kernel";
blur-size = 20;
blur-deviation = 8.0;
blur-kern = "3x3box";
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
