name: Nexus ISO Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nexus-iso-gate.yml"
      - "omnios/Cargo.toml"
      - "omnios/Cargo.lock"
      - "omnios/loader/**"
      - "image/**"
      - "verify.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexus-iso-gate.yml"
      - "omnios/Cargo.toml"
      - "omnios/Cargo.lock"
      - "omnios/loader/**"
      - "agent/app_installer.py"
      - "verify.sh"
      - "scripts/*security*py"
      - "image/build.sh"
      - "image/desktop.list.chroot"
      - "image/validate.sh"
      - "image/hooks/**"
      - "image/includes/**"
      - "image/boot-smoke.sh"
      - "image/verify-artifact.sh"

permissions:
  contents: read

concurrency:
  group: nexus-iso-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  desktop-preflight:
    uses: ./.github/workflows/nexus-native-desktop.yml
  build-and-boot:
    needs: desktop-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and VM dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso squashfs-tools curl jq xz-utils \
            gcc-mingw-w64-x86-64 wine wine64 winetricks cabextract winbind fonts-liberation xvfb file unzip \
            dbus-x11 xauth xfce4-session xfdesktop4 xfce4-panel xfwm4 xfce4-settings \
            python3-pil python3-gi gir1.2-gtk-3.0 x11-utils xdotool gcc-aarch64-linux-gnu \
            qemu-user-static clang lld arc-theme papirus-icon-theme fonts-inter librsvg2-common zenity
          sudo install -Dm644 image/includes/usr/share/backgrounds/nexus/horizon-aurora.svg \
            /usr/share/backgrounds/nexus/horizon-aurora.svg

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android build SDK only (no system emulator)
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm /111 | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install real Chromium for the PWA and WebAssembly smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium browser binary
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/nexus-playwright" playwright
          "$RUNNER_TEMP/nexus-playwright/node_modules/.bin/playwright" install --with-deps chromium
          chrome="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm /111 -print -quit)"
          test -n "$chrome"
          sudo ln -sfn "$chrome" /usr/local/bin/chromium

      - name: Install project Rust nightly for the Linux loader
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Test real Linux loader
        run: |
          cargo +nightly -Z bindeps test --manifest-path omnios/Cargo.toml -p omni-loader

      - name: Compile loader and stage checksum-verified Wasmtime
        run: bash image/stage-omni-subsystem.sh

      - name: Run real Windows, WebAssembly, Android payload, and iOS payload tests
        run: bash image/runtime-smoke.sh

      - name: Preflight and build inside Debian Trixie
        run: |
          docker run --rm --privileged \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/src \
            --workdir /src \
            debian:trixie bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends live-build python3 python3-tk ca-certificates
              bash verify.sh
              bash image/build.sh
            '

      - name: Verify ISO artifact and integrated runtimes
        run: |
          bash image/verify-artifact.sh image/work
          cd image/work
          sha256sum -c SHA256SUMS
          iso="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          bash ../verify-omni-image.sh "$iso"

      - name: Locate candidate
        id: iso
        shell: bash
        run: |
          set -euo pipefail
          iso="$(find image/work -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          echo "path=$iso" >> "$GITHUB_OUTPUT"

      - name: Inspect final ISO boot configuration
        shell: bash
        run: |
          set -euo pipefail
          iso="${{ steps.iso.outputs.path }}"
          xorriso -indev "$iso" -find /boot/grub -type f -print > nexus-iso-grub-files.txt 2>&1 || true
          found=0
          for cfg in /boot/grub/grub.cfg /EFI/BOOT/grub.cfg; do
            out="nexus-iso-$(echo "$cfg" | tr '/' '_')"
            if xorriso -osirrox on -indev "$iso" -extract "$cfg" "$out" 2>/dev/null && [ -s "$out" ]; then
              echo "Extracted $cfg"
              grep -n -E 'timeout|default|menuentry|linux|initrd' "$out" | head -n 80 || true
              if [ "$cfg" = /boot/grub/grub.cfg ]; then
                found=1
                grep -Eq '^[[:space:]]*set timeout=3[[:space:]]*$' "$out"
                grep -Eq '^[[:space:]]*set default=0[[:space:]]*$' "$out"
                grep -q 'menuentry "Live system' "$out"
              fi
            fi
          done
          test "$found" -eq 1

      - name: UEFI guest readiness smoke test
        env:
          NEXUS_BOOT_TIMEOUT: "180"
          NEXUS_BOOT_LOG: nexus-qemu-serial.log
        run: bash image/boot-smoke.sh "${{ steps.iso.outputs.path }}"

      - name: Record build verification evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Nexus ISO verification evidence'
            echo ''
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Trigger: $GITHUB_EVENT_NAME"
            if test -f image/work/SHA256SUMS; then
              echo 'Candidate ISO checksums:'
              cat image/work/SHA256SUMS
            else
              echo 'Candidate ISO checksums: not produced'
            fi
            if test -s evidence/boot/desktop-boot.png; then
              echo 'XFCE desktop screenshot: evidence/boot/desktop-boot.png'
              echo 'Windows GUI screenshot: evidence/windows/wine-gui-running.png'
              echo 'Android APK runtime: evidence/android/apk-running.png'
              echo 'Chromium PWA + WebAssembly runtime: evidence/web/crx-pwa-running.png'
              echo 'iOS Simulator ARM64 runtime: evidence/ios/ipa-running.png'
            else
              echo 'XFCE desktop screenshot: not produced'
            fi
            if test -f nexus-qemu-serial.log; then
              for marker in NEXUS_LIVE_BOOT_READY_V1 NEXUS_GRAPHICAL_STACK_READY_V1 NEXUS_XFCE_SESSION_READY_V1; do
                if grep -q "$marker" nexus-qemu-serial.log; then
                  echo "$marker: detected"
                else
                  echo "$marker: not detected"
                fi
              done
            else
              echo 'QEMU serial log: not produced'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-boot-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            nexus-qemu-serial.log
            nexus-qemu-debug.log
            nexus-iso-grub-files.txt
            nexus-iso-*
            evidence/boot/desktop-boot.png
            evidence/windows/wine-gui-running.png
            evidence/android/apk-running.png
            evidence/web/crx-pwa-running.png
            evidence/ios/ipa-running.png

      - name: Upload verified candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            image/work/*.iso
            image/work/SHA256SUMS
            nexus-qemu-serial.log
            evidence/boot/desktop-boot.png
            evidence/windows/wine-gui-running.png
            evidence/android/apk-running.png
            evidence/web/crx-pwa-running.png
            evidence/ios/ipa-running.png

# Operational trigger: refresh the ISO Gate runner after the queued run #163.
