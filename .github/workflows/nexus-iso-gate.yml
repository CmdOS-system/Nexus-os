name: Nexus ISO Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "image/build.sh"
      - "image/desktop.list.chroot"
      - "image/validate.sh"
      - "image/hooks/**"
      - "image/includes/**"
      - "image/boot-smoke.sh"
      - "image/verify-artifact.sh"
      - ".github/workflows/nexus-iso-gate.yml"

permissions:
  contents: read

concurrency:
  group: nexus-iso-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso

      - name: Preflight and build inside Debian Trixie
        run: |
          docker run --rm --privileged \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/src \
            --workdir /src \
            debian:trixie bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends live-build python3 ca-certificates
              bash verify.sh
              bash image/build.sh
            '

      - name: Verify ISO artifact
        run: |
          bash image/verify-artifact.sh image/work
          cd image/work
          sha256sum -c SHA256SUMS

      - name: Locate candidate
        id: iso
        shell: bash
        run: |
          set -euo pipefail
          iso="$(find image/work -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          echo "path=$iso" >> "$GITHUB_OUTPUT"

      - name: Inspect final ISO boot configuration
        shell: bash
        run: |
          set -euo pipefail
          iso="${{ steps.iso.outputs.path }}"
          xorriso -indev "$iso" -find /boot/grub -type f -print > nexus-iso-grub-files.txt 2>&1 || true
          found=0
          for cfg in /boot/grub/grub.cfg /EFI/BOOT/grub.cfg; do
            out="nexus-iso-$(echo "$cfg" | tr '/' '_')"
            if xorriso -osirrox on -indev "$iso" -extract "$cfg" "$out" 2>/dev/null && [ -s "$out" ]; then
              echo "Extracted $cfg"
              grep -n -E 'timeout|default|menuentry|linux|initrd' "$out" | head -n 80 || true
              if [ "$cfg" = /boot/grub/grub.cfg ]; then
                found=1
                grep -Eq '^[[:space:]]*set timeout=3[[:space:]]*$' "$out"
                grep -Eq '^[[:space:]]*set default=0[[:space:]]*$' "$out"
                grep -q 'menuentry "Live system' "$out"
              fi
            fi
          done
          test "$found" -eq 1

      - name: UEFI guest readiness smoke test
        env:
          NEXUS_BOOT_TIMEOUT: "180"
          NEXUS_BOOT_LOG: nexus-qemu-serial.log
        run: bash image/boot-smoke.sh "${{ steps.iso.outputs.path }}"

      - name: Record build verification evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Nexus ISO verification evidence'
            echo ''
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Trigger: $GITHUB_EVENT_NAME"
            if test -f image/work/SHA256SUMS; then
              echo 'Candidate ISO checksums:'
              cat image/work/SHA256SUMS
            else
              echo 'Candidate ISO checksums: not produced'
            fi
            if test -f nexus-qemu-serial.log; then
              for marker in NEXUS_LIVE_BOOT_READY_V1 NEXUS_GRAPHICAL_STACK_READY_V1 NEXUS_XFCE_SESSION_READY_V1; do
                if grep -q "$marker" nexus-qemu-serial.log; then
                  echo "$marker: detected"
                else
                  echo "$marker: not detected"
                fi
              done
            else
              echo 'QEMU serial log: not produced'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-boot-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            nexus-qemu-serial.log
            nexus-qemu-debug.log
            nexus-iso-grub-files.txt
            nexus-iso-*

      - name: Upload verified candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            image/work/*.iso
            image/work/SHA256SUMS
            nexus-qemu-serial.log
