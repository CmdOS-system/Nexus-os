name: Recovery G2 Python tests
on:
  push:
    paths:
      - 'recovery_g2/**'
      - 'efi_probe/**'
      - 'tests/test_recovery_g2_*.py'
      - '.github/workflows/recovery-g2.yml'
  pull_request:
    paths:
      - 'recovery_g2/**'
      - 'tests/test_recovery_g2_*.py'
      - '.github/workflows/recovery-g2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real QCOW2 tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils qemu-system-x86 ovmf clang lld dosfstools mtools file
          qemu-img --version
      - name: Compile Recovery G2 sources
        run: python -m compileall -q recovery_g2 tests
      - name: Run Recovery G2 unit and integration tests
        run: python -m unittest discover -s tests -p 'test_recovery_g2_*.py' -v
      - name: Run real qemu-img smoke test
        run: python -m recovery_g2.smoke
      - name: Power on real OVMF firmware in QEMU (not an OS boot)
        run: python -m recovery_g2.ovmf_probe
      - name: Build minimal UEFI executable
        run: bash efi_probe/build.sh
      - name: Require actual UEFI guest execution marker
        run: python -m recovery_g2.efi_boot_probe
      - name: Install Linux kernel and static initramfs tooling
        run: sudo apt-get install -y linux-image-generic busybox-static cpio
      - name: Boot real Linux kernel and require guest init marker
        run: bash recovery_g2/linux_boot_ci.sh
