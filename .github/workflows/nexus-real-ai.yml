name: Nexus Real AI Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nexus-real-ai.yml'
      - 'agent/tests/real_ollama_smoke.py'

permissions:
  contents: read

concurrency:
  group: nexus-real-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start CPU Ollama on loopback
        run: |
          docker pull ollama/ollama:latest
          docker image inspect ollama/ollama:latest --format '{{json .RepoDigests}}' > nexus-ollama-image-digest.json
          docker run -d --name nexus-ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/tags; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Download real small model
        run: timeout 600 docker exec nexus-ollama ollama pull qwen2.5:0.5b
      - name: Exercise real provider and saved-model CLI
        run: python3 agent/tests/real_ollama_smoke.py
      - name: Collect runtime logs
        if: always()
        run: docker logs nexus-ollama > nexus-ollama.log 2>&1 || true
      - name: Preserve real inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-real-ai-evidence
          path: |
            nexus-real-ai-evidence.json
            nexus-ollama-image-digest.json
            nexus-ollama.log
          if-no-files-found: warn
      - name: Remove disposable model runtime
        if: always()
        run: docker rm -f nexus-ollama || true
