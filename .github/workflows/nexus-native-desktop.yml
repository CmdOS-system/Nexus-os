name: Nexus Native Desktop Smoke
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - '.github/workflows/nexus-native-desktop.yml'
      - 'agent/tests/native_desktop_*'
  pull_request:
    paths:
      - 'image/includes/**'
      - 'image/desktop.list.chroot'
      - 'agent/tests/native_desktop_*'
      - '.github/workflows/nexus-native-desktop.yml'
permissions:
  contents: read
jobs:
  native-session:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
      XDG_RUNTIME_DIR: /tmp/nexus-runtime
    steps:
      - name: Install the target Debian desktop stack
        run: |
          apt-get update
          apt-get install -y git ca-certificates xfce4-session xfdesktop4 xfce4-panel xfwm4 xfce4-settings desktop-base dbus-x11 xvfb xauth x11-utils python3-tk python3-pil python3-gi gir1.2-gtk-3.0 arc-theme papirus-icon-theme fonts-inter librsvg2-common librsvg2-bin
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
      - uses: actions/checkout@v4
      - name: Record target versions and render the wallpaper reference
        run: |
          mkdir -p native-desktop-evidence
          dpkg-query -W xfdesktop4 xfce4-session xfwm4 libxfconf-0-3 > native-desktop-evidence/packages.txt
          cat /etc/os-release > native-desktop-evidence/os-release.txt
          install -Dm644 image/includes/usr/share/backgrounds/nexus/horizon-aurora.svg /usr/share/backgrounds/nexus/horizon-aurora.svg
          rsvg-convert -w 1920 -h 1080 /usr/share/backgrounds/nexus/horizon-aurora.svg -o native-desktop-evidence/expected-aurora.png
      - name: Exercise actual Debian XFCE and compare rendered wallpaper
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' bash agent/tests/native_desktop_smoke.sh
      - name: Preserve Debian session evidence (not an ISO boot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-native-session-evidence
          path: native-desktop-evidence/
          if-no-files-found: warn
