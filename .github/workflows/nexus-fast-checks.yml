name: Nexus Fast Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "image/**"
      - "verify.sh"
      - ".github/workflows/nexus-fast-checks.yml"
  pull_request:
    paths:
      - "agent/**"
      - "image/**"
      - "verify.sh"
      - ".github/workflows/nexus-fast-checks.yml"

permissions:
  contents: read

concurrency:
  group: nexus-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile agent modules
        run: python -m compileall -q agent
      - name: Run unit tests
        run: python -m unittest discover -s agent/tests -p 'test_*.py' -v

  gui-smoke:
    name: Installer GUI smoke (Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk python3-pil
      - name: Exercise installer read-only UI
        run: xvfb-run -a /usr/bin/python3 agent/tests/gui_smoke.py
      - name: Exercise Nexus Control Center widgets
        run: xvfb-run -a /usr/bin/python3 agent/tests/control_center_gui_smoke.py
      - name: Exercise Nexus Horizon graphical launcher
        run: xvfb-run -a /usr/bin/python3 agent/tests/horizon_gui_smoke.py
      - name: Exercise Nexus Horizon panel preview
        run: xvfb-run -a /usr/bin/python3 agent/tests/horizon_panel_gui_smoke.py
      - name: Exercise Horizon desktop integration
        run: xvfb-run -a /usr/bin/python3 agent/tests/horizon_desktop_integration_smoke.py
      - name: Capture real Nexus Horizon screenshot
        run: xvfb-run -a -s "-screen 0 1024x768x24" /usr/bin/python3 agent/tests/horizon_screenshot.py
      - name: Capture Horizon integrated desktop screenshot
        run: xvfb-run -a -s "-screen 0 1024x768x24" /usr/bin/python3 agent/tests/horizon_desktop_screenshot.py
      - name: Publish Horizon integrated desktop screenshot
        uses: actions/upload-artifact@v4
        with:
          name: nexus-horizon-desktop-preview
          path: nexus-horizon-desktop-preview.png
          if-no-files-found: error
      - name: Publish Nexus Horizon screenshot
        uses: actions/upload-artifact@v4
        with:
          name: nexus-horizon-visual-preview
          path: nexus-horizon-preview.png
          if-no-files-found: error

  image-staging:
    name: Installer runtime staging (no ISO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify image runtime modules and staged launcher imports
        run: |
          bash image/validate.sh
          test -s agent/installer_preflight.py
          test -s image/includes/opt/nexus/installer-preview.py
          python3 -m py_compile agent/installer_preflight.py agent/local_model_diagnostics.py image/includes/opt/nexus/installer-preview.py image/includes/opt/nexus/control-center.py
          grep -q "from installer_preflight import inspect" image/includes/opt/nexus/installer-preview.py
          grep -q "installer_preflight.py" image/build.sh
          grep -q "Open installation preview (read-only)" image/includes/opt/nexus/control-center.py
          grep -q "AI configuration: Cloud" image/includes/opt/nexus/control-center.py
          grep -q "subprocess.Popen" image/includes/opt/nexus/control-center.py
          mkdir -p /tmp/nexus-stage/opt/nexus/agent
          cp image/includes/opt/nexus/installer-preview.py image/includes/opt/nexus/control-center.py /tmp/nexus-stage/opt/nexus/
          for module in installer_plan.py installer_inventory.py installer_preflight.py local_model_diagnostics.py settings.py settings_store.py config.py linux_secret_store.py secret_store.py; do
            cp "agent/$module" /tmp/nexus-stage/opt/nexus/agent/
          done
          PYTHONPATH=/tmp/nexus-stage/opt/nexus/agent python3 -c "import installer_plan, installer_inventory, installer_preflight, local_model_diagnostics, settings, settings_store, config, linux_secret_store; assert installer_preflight.inspect({'blockdevices': []})['installation_enabled'] is False"
          python3 -m py_compile /tmp/nexus-stage/opt/nexus/control-center.py /tmp/nexus-stage/opt/nexus/installer-preview.py
          echo "Installer runtime staging checks passed without ISO rebuild"

  image-static:
    name: Image static validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate image sources
        run: bash image/validate.sh
      - name: Check shell syntax
        run: |
          bash -n image/build.sh image/validate.sh verify.sh
          sh -n image/hooks/020-unattended-grub.hook.binary
