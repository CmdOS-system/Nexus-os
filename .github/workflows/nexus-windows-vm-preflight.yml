name: Nexus Windows VM Prerequisites
on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/tests/windows_vm_kvm_smoke.py'
      - 'agent/windows_vm_preflight.py'
      - 'agent/tests/test_windows_vm_preflight.py'
      - '.github/workflows/nexus-windows-vm-preflight.yml'
permissions:
  contents: read
jobs:
  observe-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify classification and observe actual runner without changing it
        run: |
          python3 -m unittest discover -s agent/tests -p test_windows_vm_preflight.py
          python3 agent/windows_vm_preflight.py > windows-vm-prerequisites.json
      - name: Distinguish runner KVM permissions from unavailable hardware
        run: |
          sudo -n /usr/bin/python3 agent/windows_vm_preflight.py > windows-vm-prerequisites-admin.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vm-readonly-prerequisites
          path: windows-vm-prerequisites*.json

  exercise-kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools only on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 freerdp3-x11 xvfb xauth
      - name: Create run stop and destroy a diskless KVM machine
        run: |
          sudo -n env NEXUS_DISPOSABLE_VM_LAB=1 xvfb-run -a /usr/bin/python3 agent/tests/windows_vm_kvm_smoke.py
      - name: Preserve actual engine result without claiming Word acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-kvm-engine-evidence
          path: windows-vm-evidence/
          if-no-files-found: warn
