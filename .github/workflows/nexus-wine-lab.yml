name: Nexus Windows Application Lab
on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/tests/windows_7zip_lab.sh'
      - 'agent/tests/windows_notepad_lab.py'
      - 'agent/app_installer.py'
      - 'agent/tests/windows_installer_gui_smoke.py'
      - 'agent/tests/windows_file_association_smoke.py'
      - 'image/includes/usr/share/applications/nexus-app-install.desktop'
      - 'image/includes/etc/skel/.config/mimeapps.list'
      - '.github/workflows/nexus-wine-lab.yml'
permissions:
  contents: read
concurrency:
  group: windows-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-7zip:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Debian Wine and test display
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl wine wine64 fonts-wine xvfb xauth x11-utils python3 python3-pil python3-tk desktop-file-utils shared-mime-info xdg-utils libglib2.0-bin dbus-x11 file xdotool
          useradd --create-home nexuslab
      - uses: actions/checkout@v4
      - name: Install and exercise actual Windows 7-Zip as an unprivileged user
        run: |
          mkdir -p windows-evidence
          chown nexuslab:nexuslab windows-evidence
          runuser -u nexuslab -- xvfb-run -a -s '-screen 0 1280x800x24' bash agent/tests/windows_7zip_lab.sh
      - name: Exercise graphical selection confirmation installation and launch
        run: |
          install -D -m 644 agent/app_installer.py /opt/nexus/agent/app_installer.py
          runuser -u nexuslab -- dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' python3 agent/tests/windows_installer_gui_smoke.py
      - name: Stage and validate actual EXE desktop association
        run: |
          install -D -m 644 agent/app_installer.py /opt/nexus/agent/app_installer.py
          install -D -m 644 image/includes/usr/share/applications/nexus-app-install.desktop /usr/share/applications/nexus-app-install.desktop
          install -D -m 644 image/includes/etc/skel/.config/mimeapps.list /etc/skel/.config/mimeapps.list
          desktop-file-validate /usr/share/applications/nexus-app-install.desktop
          update-desktop-database /usr/share/applications
          runuser -u nexuslab -- dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' python3 agent/tests/windows_file_association_smoke.py
      - name: Install Notepad++ and edit/save through actual Windows GUI
        run: |
          runuser -u nexuslab -- xvfb-run -a -s '-screen 0 1280x800x24' python3 agent/tests/windows_notepad_lab.py
      - name: Preserve real Windows application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-7zip-evidence
          path: windows-evidence/
          if-no-files-found: warn
